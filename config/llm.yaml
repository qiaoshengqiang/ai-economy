version: 1
providers:
  mock:
    adapter: mock
    timeout_seconds: 300
    default_model: mock_model
  deepseek:
    adapter: deepseek
    timeout_seconds: 300.0
    base_url: https://api.deepseek.com
    default_model: deepseek_flash
  doubao:
    adapter: doubao
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout_seconds: 300
    default_model: doubao_novel
    request:
      max_tokens_field: max_completion_tokens
      extra_body:
        thinking:
          type: disabled
  bailian:
    adapter: bailian
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout_seconds: 300
    default_model: qwen_fast
  opencode:
    adapter: openai_compatible
    base_url: https://opencode.ai/inference/go/openai/v1
    timeout_seconds: 300
    request:
      extra_headers:
        x-opencode-session: ses_aieos_local
models:
  deepseek_chat:
    provider: deepseek
    model_id: deepseek-chat
    context_window: 600000
    max_output_tokens: 32768
    supports_reasoning: true
    thinking_levels:
    - 'off'
    - low
    - high
    - max
  deepseek_flash:
    provider: deepseek
    model_id: deepseek-flash
    context_window: 600000
    max_output_tokens: 32768
    supports_reasoning: true
    thinking_levels:
    - 'off'
    - low
    - high
    - max
  doubao_novel:
    provider: doubao
    model_id: ep-20261004151436-sgwpt
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels:
    - 'off'
  qwen_fast:
    provider: bailian
    model_id: qwen3.8-flash
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels:
    - 'off'
    - low
    - medium
    - high
  qwen_max:
    provider: bailian
    model_id: qwen3.8-max
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels:
    - 'off'
    - low
    - medium
    - high
  opencode_glm:
    provider: opencode
    model_id: glm-5.3
    context_window: 1000000
    max_output_tokens: 32768
    supports_reasoning: false
    thinking_levels:
    - 'off'
  opencode_kimi:
    provider: opencode
    model_id: kimi-k3
    context_window: 1048576
    max_output_tokens: 32768
    supports_reasoning: false
    thinking_levels:
    - 'off'
  opencode_minimax:
    provider: opencode
    model_id: minimax-m3
    context_window: 512000
    max_output_tokens: 32768
    supports_reasoning: false
    thinking_levels:
    - 'off'
  opencode_qwen:
    provider: opencode
    model_id: qwen3.8-max
    context_window: 262144
    max_output_tokens: 32768
    supports_reasoning: false
    thinking_levels:
    - 'off'
  mock_model:
    provider: mock
    model_id: mock-model-v1
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: false
    thinking_levels:
    - 'off'
credentials:
  deepseek_key_a:
    env: DEEPSEEK_KEY_AGENT_A
  deepseek_key_b:
    env: DEEPSEEK_KEY_AGENT_B
  deepseek_key_c:
    env: DEEPSEEK_KEY_AGENT_C
  deepseek_key_d:
    env: DEEPSEEK_KEY_AGENT_D
  deepseek_key_e:
    env: DEEPSEEK_KEY_AGENT_E
  doubao_key:
    env: DOUBAO_API_KEY
  bailian_key_d:
    env: BAILIAN_KEY_AGENT_D
  bailian_key_e:
    env: BAILIAN_KEY_AGENT_E
  opencode_key:
    env: OPENCODE_KEY
