# ============================================================
# LLM Registry — providers / models / credentials
# ------------------------------------------------------------
# 这是 GUI「系统设置」管理的唯一权威文件。
# config/config.yaml 不再定义这三段；避免同一事实两份来源。
#
# 🔒 credentials 只保存环境变量名，secret 明文只在 .env。
# 🔒 修改后需要重启 UI 进程才会进入 Runtime。
# ============================================================

providers:
  mock:
    adapter: mock
    timeout_seconds: 300
    # 【default_model 是什么】
    #   当**没有**显式指定模型时，这个端点用哪个 model profile。
    #   它是一个 **model profile 名**（不是 model id）—— 改真实模型 id 时
    #   这里不用动。
    #
    #   🔴 这一项的存在是为了修掉 CONFIGURATION_SYSTEM_AUDIT.md §B1
    #      「Model 优先级倒置」：以前 provider 段的 `model` 会被
    #      AgentConfig 当成**显式**参数，于是静默屏蔽 .env 的值。
    #      现在它只是一个**显式的**默认值 —— 来源唯一、GUI 可显示、
    #      也不再和 Agent 自己的选择打架。
    default_model: mock_model
  deepseek:
    adapter: deepseek
    base_url: https://api.deepseek.com
    timeout_seconds: 300
    # deepseek 有两个 canonical model（chat / flash），
    # 这里指定「不显式选时用哪个」—— 与重构前的实际行为一致。
    default_model: deepseek_chat
  doubao:
    adapter: doubao
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout_seconds: 300
    default_model: doubao_novel
    request:
      max_tokens_field: max_completion_tokens
      extra_body:
        thinking:
          type: disabled
  bailian:
    adapter: bailian
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout_seconds: 300
    # 🔴 **必须有 default_model** —— 因为 `BailianProvider`
    #    声明了 `requires_explicit_model = True`：
    #    百炼没有普适的默认模型名（qwen_fast / qwen_max 取决于用途），
    #    所以 `is_available()` 要求**端点层给出一个兜底**，
    #    否则整个端点会被判为不可用。
    #
    # ⚠️ 这里曾经**故意留空**，理由是「给任意一个都会变成静默偏好」。
    #    那个理由与实际行为冲突：留空不是「没有偏好」，
    #    而是「这个端点不能用」—— `./dev.sh ask --agent agent_e`
    #    会直接报「百炼 没有配置模型名」。
    #
    # 🔒 为什么现在可以安心给一个：它只是**兜底**。
    #    每个用百炼的 Agent 都在自己的 `brain.model` 里显式选了 profile
    #    （agent_d/novel_editor → qwen_fast，agent_e/novel_reader → qwen_max），
    #    Runtime 每次调用都会把解析出的真实 model id 传进来。
    #    兜底**永远不会改变**这些 Agent 实际用的模型。
    #
    # 🔒 选 `qwen_fast` 而不是 `qwen_max`：它是更保守/更便宜的那个，
    #    作为「有人忘了指定模型」时的默认更合适。
    default_model: qwen_fast
models:
  deepseek_chat:
    # legacy 名称仍路由到 deepseek-flash（V4.1-Flash）；
    # 1M context，384K 是 provider 上限；16K 是 AIEOS 的单次输出上限。
    provider: deepseek
    model_id: deepseek-chat
    context_window: 1000000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels: ["off", "low", "high", "max"]
  deepseek_flash:
    # DeepSeek-V4.1-Flash-1017：1M context，384K max output；
    # 16K 是 AIEOS 的单次输出上限，不是模型能力上限。
    provider: deepseek
    model_id: deepseek-flash
    context_window: 1000000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels: ["off", "low", "high", "max"]
  doubao_novel:
    provider: doubao
    model_id: ep-20261004151436-sgwpt
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels: ["off"]
  qwen_fast:
    provider: bailian
    model_id: qwen3.8-flash
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels: ["off", "low", "medium", "high"]
  qwen_max:
    provider: bailian
    model_id: qwen3.8-max
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: true
    thinking_levels: ["off", "low", "medium", "high"]
  mock_model:
    provider: mock
    model_id: mock-model-v1
    context_window: 128000
    max_output_tokens: 16384
    supports_reasoning: false
    thinking_levels: ["off"]
credentials:
  deepseek_key_a:
    env: DEEPSEEK_KEY_AGENT_A
  deepseek_key_b:
    env: DEEPSEEK_KEY_AGENT_B
  deepseek_key_c:
    env: DEEPSEEK_KEY_AGENT_C
  deepseek_key_d:
    env: DEEPSEEK_KEY_AGENT_D
  deepseek_key_e:
    env: DEEPSEEK_KEY_AGENT_E
  doubao_key:
    env: DOUBAO_API_KEY
  bailian_key_d:
    env: BAILIAN_KEY_AGENT_D
  bailian_key_e:
    env: BAILIAN_KEY_AGENT_E
