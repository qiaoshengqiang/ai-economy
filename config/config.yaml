# ============================================================
# AI Economy OS v0.1 - 全局配置
# ------------------------------------------------------------
# 原则：所有「经常变化的参数」都放在这里，不许硬编码进 Python。
# 改这个文件不需要动任何代码。
# ============================================================

system:
  name: "AI Economy OS"
  version: "0.1"
  # 日志等级：DEBUG / INFO / WARNING / ERROR
  # 环境变量 AI_ECONOMY_LOG_LEVEL 可以覆盖它
  log_level: "INFO"

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  # 路径相对于项目根目录
  database_path: "data/economy.db"

# ------------------------------------------------------------
# 经济系统参数
# ------------------------------------------------------------
economy:
  # 本系统的记账单位。v0.1 用本地 Ledger 模拟，不接区块链。
  currency: "AIC"
  currency_name: "AI Coin"

  # 【核心经济模型参数】多少 token 折算成 1 个 AI 币。
  # 1 AI币 ≈ 10,000 tokens
  # 以后要调经济模型，只改这一行。
  tokens_per_ai_coin: 10000

  # 新 Agent 出生时拿到多少启动资金。
  # 用「创世铸币」交易的方式注入 Ledger，而不是直接写余额字段。
  initial_balance: 100

  # 账本里金额保留几位小数
  amount_precision: 4

  # 余额小于等于这个值 -> 判定为 INSOLVENT（失去偿付能力）
  insolvency_threshold: 0

# ------------------------------------------------------------
# LLM 提供商注册表
# ------------------------------------------------------------
# 这里只描述「有哪些提供商、默认模型、用哪个环境变量拿 key」。
# 真正的调用逻辑在 llm/ 目录里，一个文件一个提供商。
#
# enabled: false 的 provider 不会在启动时初始化。
# v0.1 默认全部走 mock，所以即使一个 Key 都没有，系统也能跑。
# ------------------------------------------------------------
llm:
  # 全局默认提供商。Agent 自己的 config.yaml 可以覆盖它。
  default_provider: "mock"

  providers:

    mock:
      enabled: true
      # MockProvider 不需要 key，不需要网络。
      # 它的存在是为了：让整个经济系统在没有 API Key 时也能完整测试。
      model: "mock-model-v1"
      # 模拟的 token 用量，后面做成本计算时会用到
      simulated_input_tokens: 20000
      simulated_output_tokens: 8000

    deepseek:
      enabled: true
      api_key_env: "DEEPSEEK_API_KEY"
      base_url_env: "DEEPSEEK_BASE_URL"
      model_env: "DEEPSEEK_MODEL"
      base_url: "https://api.deepseek.com"
      model: "deepseek-chat"
      timeout_seconds: 60

    doubao:
      enabled: true
      api_key_env: "DOUBAO_API_KEY"
      base_url_env: "DOUBAO_BASE_URL"
      model_env: "DOUBAO_MODEL"
      base_url: "https://ark.cn-beijing.volces.com/api/v3"

      # 豆包必须显式指定模型，没有合理的默认值。
      # 两种写法（二选一）：
      #   ① 模型名称（推荐）：doubao-seed-1-6-250615
      #   ② 推理接入点 ID：ep-2024xxxxxxxxx-xxxxx
      # 一般填在 .env 的 DOUBAO_MODEL 里，不用改这里。
      model: ""

      timeout_seconds: 60

      # ----------------------------------------------------------
      # 下面两项是「逃生舱」，平时不用动。
      # 但豆包的某些模型（尤其是带思考的）【真的会用到】。
      # ----------------------------------------------------------

      # max_tokens_field：请求体里「最大输出长度」的字段名。
      #
      # 【实测发现 / 2025-09】
      #   某些豆包模型会【忽略】请求里的 max_tokens：
      #       传 max_tokens=16，实际输出 2586 tokens
      #   换成 max_completion_tokens 就正常了（输出 16）。
      #
      #   注意两个字段不能同时传，否则报 400：
      #       "max_tokens and max_completion_tokens cannot be set at the same time"
      #
      #   所以这里改成 "max_completion_tokens" 即可，无需改代码。
      max_tokens_field: "max_tokens"

      # extra_body：额外塞进请求体的字段。
      #
      # 【实测发现 / 2025-09】这是本配置项最有价值的用法 ——
      #
      #   同一个问题，带思考 vs 不带思考：
      #       带思考（默认）:  输出 2586 tokens，可见内容 27 字
      #       关掉思考:        输出  16 tokens，可见内容 27 字
      #
      #   同样的答案，成本差 160 倍。
      #   对 AI Economy 这个项目来说，这就是「智力成本」最真实的例子 ——
      #   它和你能看到的输出完全不成比例。
      #
      #   想省钱就打开下面这行：
      #
      # extra_body:
      #   thinking:
      #     type: disabled

    grok:
      enabled: true
      api_key_env: "GROK_API_KEY"
      base_url_env: "GROK_BASE_URL"
      model_env: "GROK_MODEL"
      base_url: "https://api.x.ai/v1"
      model: "grok-2-latest"
      timeout_seconds: 60

# ------------------------------------------------------------
# 任务与合同
# ------------------------------------------------------------
task:
  # 一个任务最多活多久（秒）。超时后可以被判定失败。
  default_timeout_seconds: 300

# ------------------------------------------------------------
# 未来扩展开关（v0.1 全部关闭，先留接口）
# ------------------------------------------------------------
future:
  enable_network_transport: false
  enable_blockchain_ledger: false
  enable_p2p_discovery: false
