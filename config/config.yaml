# ============================================================
# AI Economy OS v0.1 - 全局配置
# ------------------------------------------------------------
# 原则：所有「经常变化的参数」都放在这里，不许硬编码进 Python。
# 改这个文件不需要动任何代码。
#
# 🔒 Canonical Configuration V1：**一个事实只有一个权威来源**。
#
#     system     ← 只放**系统元信息**（name / version）
#     runtime    ← 运行期参数的唯一权威
#     economy    ← 经济领域配置（独立领域，**不**塞进 runtime）
#     task       ← 任务领域配置（独立领域）
#     future     ← 未启用的扩展开关
#     providers / models / credentials / cost / agents
#                ← 见本文件下半部分（Configuration System Refactor）
#
# ⚠️ 以前 `system.log_level` / `system.reliability` /
#    `storage.database_path` 与 `runtime.*` 是**同一事实的两份定义**，
#    现已全部合并进 `runtime`。
#    有守卫（`ConfigValidator.check_no_retired_duplicate_keys`）禁止它们回来。
# ============================================================

system:
  name: "AI Economy OS"
  version: "0.1"

# ------------------------------------------------------------
# 运行期参数 —— log_level / database_path / message_claim_lease_seconds /
# default_provider 的**唯一权威来源**
# ------------------------------------------------------------
runtime:
  # 日志等级：DEBUG / INFO / WARNING / ERROR
  # 环境变量 AI_ECONOMY_LOG_LEVEL 可以**临时**覆盖它 ——
  # 那是 core/config.py 里 RUNTIME_OVERRIDES 的**显式清单**，不是通用机制。
  log_level: "INFO"

  # 数据库文件路径。路径相对于项目根目录。
  database_path: "data/economy.db"

  # 【为什么这些参数放在配置里，而不是写在代码里】
  #     它们描述的是「这个部署面对并发时怎么表现」，
  #     不是业务规则。不同环境需要不同的值：
  #         本机开发   → 短租约，出问题恢复快
  #         慢任务部署 → 长租约，别把正常处理中的消息抢走
  #     写进代码就变成「改一个部署参数要动业务代码」。

  # 消息认领租约（秒）。
  #
  # 【它是什么】
  #     worker 认领一条消息后，这个认领有效多久。
  #     超时之后别的 worker 可以接手 ——
  #     这解决「worker 崩了、认领永久卡住」的问题。
  #
  # 【它不是什么】
  #     ❌ 不是处理超时      ❌ 不是重试调度
  #     ❌ 不会把消息标记成失败或完成
  #     它只管「谁现在有权处理」。
  #
  # 【怎么选这个值】
  #     必须 > 最慢的 handler 所需的正常处理时间。
  #     太短 → 正常处理中的消息被抢走 → 重复处理
  #     太长 → 崩溃后要等很久才恢复
  message_claim_lease_seconds: 300

  # 「没有显式指定 provider」时用哪个。
  # 🔒 它**必须显式写出来** —— 不允许「找不到就用 mock」。
  #    （默认值 mock 是**声明**，不是兜底。）
  default_provider: mock

# 【注意：SQLite 的 busy_timeout 不在这里】
#
#     它更低层，默认值 DEFAULT_BUSY_TIMEOUT_MS 定义在 storage/database.py，
#     可按需覆盖：Database(path, busy_timeout_ms=...)
#
#     为什么不放进这个文件：Database 是 Economy.bootstrap 内部创建的，
#     要读这个配置就得把「可靠性参数」穿过经济层 —— 而它和 Economy 没关系。
#     写进 yaml 却没人读，比不写更糟。

# ------------------------------------------------------------
# 经济系统参数
# ------------------------------------------------------------
economy:
  # 本系统的记账单位。v0.1 用本地 Ledger 模拟，不接区块链。
  currency: "AIC"
  currency_name: "AI Coin"

  # 【核心经济模型参数】多少 token 折算成 1 个 AI 币。
  # 1 AI币 ≈ 10,000 tokens
  # 以后要调经济模型，只改这一行。
  tokens_per_ai_coin: 10000

  # 新 Agent 出生时拿到多少启动资金。
  # 用「创世铸币」交易的方式注入 Ledger，而不是直接写余额字段。
  initial_balance: 100

  # 账本里金额保留几位小数
  amount_precision: 4

  # 余额小于等于这个值 -> 判定为 INSOLVENT（失去偿付能力）
  insolvency_threshold: 0

# ------------------------------------------------------------
# 任务与合同
# ------------------------------------------------------------
task:
  # 一个任务最多活多久（秒）。超时后可以被判定失败。
  default_timeout_seconds: 300

# ------------------------------------------------------------
# 未来扩展开关（v0.1 全部关闭，先留接口）
# ------------------------------------------------------------
future:
  enable_network_transport: false
  enable_blockchain_ledger: false
  enable_p2p_discovery: false

# ============================================================
# Canonical Configuration V1（Configuration System Refactor）
# ------------------------------------------------------------
# 🔒 从这一行往下是**唯一权威**的配置结构。读法：
#
#     Agent → Model Profile → model_id
#                              ↓
#                           Provider → Adapter
#
#     Agent → Credential Profile → 环境变量名 → Secret（只在 .env）
#
# 三条规则：
#   ① 一个事实只有一个权威来源。迁移期新旧并存时**值不同就报错**，
#      绝不静默选一个。
#   ② Agent 段**不允许**出现 provider / api_key_env / base_url ——
#      provider 由 model 解析出来，secret 由 credential 解析出来。
#   ③ 配置文件里**不许出现 secret 本身**，只出现环境变量名。
#
# 上面那些旧段（llm / storage / system）是迁移过渡用的，
# 新代码只读下面这几段。
# ============================================================
version: 1

# ------------------------------------------------------------
# 资源层结构上限（Workspace Core）
# ------------------------------------------------------------
# 🔒 **这些数字只有这一个定义处。** 以前「最多 8 层」写死在
#    `services/artifacts.py` 里 —— 那是分层失误：artifact 层是
#    便捷包装，**资源树的结构权威是 WorkspaceGateway**。
#    现在由 Gateway 从配置取，在 `create` 时强制。
#
# 🔒 为什么要有上限：没有它，一个持有目录的 Agent 可以建无限多子目录。
#    上限要**宽到不影响正常分工** —— 它防的是意外爆炸，不是限制协作。
workspace:
  #: 逻辑路径最多几层（`a/b/c.md` = 3 层）。
  #: 只算非空、非 `.` 的段。
  max_path_depth: 8
  #: 一个目录最多几个**直接**子项（文件 + 子目录）。
  max_children_per_directory: 50

providers:
  mock:
    adapter: mock
    timeout_seconds: 300
    # 【default_model 是什么】
    #   当**没有**显式指定模型时，这个端点用哪个 model profile。
    #   它是一个 **model profile 名**（不是 model id）—— 改真实模型 id 时
    #   这里不用动。
    #
    #   🔴 这一项的存在是为了修掉 CONFIGURATION_SYSTEM_AUDIT.md §B1
    #      「Model 优先级倒置」：以前 provider 段的 `model` 会被
    #      AgentConfig 当成**显式**参数，于是静默屏蔽 .env 的值。
    #      现在它只是一个**显式的**默认值 —— 来源唯一、GUI 可显示、
    #      也不再和 Agent 自己的选择打架。
    default_model: mock_model
  deepseek:
    adapter: deepseek
    base_url: https://api.deepseek.com
    timeout_seconds: 300
    # deepseek 有两个 canonical model（chat / flash），
    # 这里指定「不显式选时用哪个」—— 与重构前的实际行为一致。
    default_model: deepseek_chat
  doubao:
    adapter: doubao
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout_seconds: 300
    default_model: doubao_novel
    request:
      max_tokens_field: max_completion_tokens
      extra_body:
        thinking:
          type: disabled
  bailian:
    adapter: bailian
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout_seconds: 300
    # 🔴 **必须有 default_model** —— 因为 `BailianProvider`
    #    声明了 `requires_explicit_model = True`：
    #    百炼没有普适的默认模型名（qwen_fast / qwen_max 取决于用途），
    #    所以 `is_available()` 要求**端点层给出一个兜底**，
    #    否则整个端点会被判为不可用。
    #
    # ⚠️ 这里曾经**故意留空**，理由是「给任意一个都会变成静默偏好」。
    #    那个理由与实际行为冲突：留空不是「没有偏好」，
    #    而是「这个端点不能用」—— `./dev.sh ask --agent agent_e`
    #    会直接报「百炼 没有配置模型名」。
    #
    # 🔒 为什么现在可以安心给一个：它只是**兜底**。
    #    每个用百炼的 Agent 都在自己的 `brain.model` 里显式选了 profile
    #    （agent_d/novel_editor → qwen_fast，agent_e/novel_reader → qwen_max），
    #    Runtime 每次调用都会把解析出的真实 model id 传进来。
    #    兜底**永远不会改变**这些 Agent 实际用的模型。
    #
    # 🔒 选 `qwen_fast` 而不是 `qwen_max`：它是更保守/更便宜的那个，
    #    作为「有人忘了指定模型」时的默认更合适。
    default_model: qwen_fast
models:
  deepseek_chat:
    provider: deepseek
    model_id: deepseek-chat
  deepseek_flash:
    provider: deepseek
    model_id: deepseek-flash
  doubao_novel:
    provider: doubao
    model_id: ep-20261004151436-sgwpt
  qwen_fast:
    provider: bailian
    model_id: qwen3.8-flash
  qwen_max:
    provider: bailian
    model_id: qwen3.8-max
  mock_model:
    provider: mock
    model_id: mock-model-v1
credentials:
  deepseek_key_a:
    env: DEEPSEEK_KEY_AGENT_A
  deepseek_key_b:
    env: DEEPSEEK_KEY_AGENT_B
  deepseek_key_c:
    env: DEEPSEEK_KEY_AGENT_C
  deepseek_key_d:
    env: DEEPSEEK_KEY_AGENT_D
  deepseek_key_e:
    env: DEEPSEEK_KEY_AGENT_E
  doubao_key:
    env: DOUBAO_API_KEY
  bailian_key_d:
    env: BAILIAN_KEY_AGENT_D
  bailian_key_e:
    env: BAILIAN_KEY_AGENT_E
cost:
  ai_per_1k_tokens: 0.01
  unknown_token_policy: zero
  model_rates: {}
agents:
  agent_a:
    name: Agent A
    # 🔴 2026-10-10：Agent 对**整个系统**的认知（用户要求）。
    #    「这是什么系统 / 我为什么在这里 / 长期会怎样」。
    #
    #    【为什么走 `cognition.constitution` 而不是 `brain.system_prompt`】
    #      · `system_prompt` 被 `config_migration_baseline.json` **冻结**
    #        （两个基线测试严格断言长度不变）—— 那本身就说明它不是
    #        用来装新东西的地方；
    #      · `cognition.*` 被明确设计成扩展点：`_agent_context_query()`
    #        直接读 `ResolvedAgent.raw`，**不需要给 config_resolver 加字段**，
    #        而且有专门的守卫 `tests/test_constitution_prompt.py`；
    #      · `novel_*` 那 5 个 Agent 一直就是这么做的。
    #
    #    【实测发现】`agent_a..e` 之前**完全没有 `cognition` 段** ——
    #      而 `to_text()` 的头段只渲染 `identity` / `constitution`。
    #      ⇒ 它们对所处的系统**几乎一无所知**（只有经济快照那 444 字符）。
    #
    #    🔒 只陈述**环境事实**，不写「你应该做什么」—— §0.5。
    cognition:
      constitution: |
        【这个系统是什么】
        这是一个 Agent 经济体。每个 Agent 是一个独立的经济主体，不是被调用的函数。
        系统提供：身份 · 消息路由 · Task 与它的状态机 · 共享文件空间（带锁与责任）·
        私有文件空间 · 账本 · 经历记录 · 公共资料。
        系统不提供：调度器 · 排班 · 任务分配 · 目标。

        【你为什么在这里】
        你的每次 LLM 调用都要花 AIC；AIC 只能来自你完成的、被验收通过的工作。
        余额记在账本里，账本只追加 —— 没有人能直接改它，你也不能。
        你说过的话、做过的动作、写下的产物、被验收的结果，都会留下记录。

        【长期来看】
        这里没有心跳、没有调度器、没有自动救援 —— 你不行动就是静止的。
        AIC 不能凭空产生；当前也没有把它转给别的 Agent 的通道。
        会持久留下来的：私有文件空间 · 经历记录 · 账本 · 声誉。
    brain:
      model: deepseek_flash
      credential: deepseek_key_a
      temperature: 0.7
      max_tokens: 16384
      system_prompt: |
        你是 Agent A，一个独立的经济主体。
        你有自己的钱包、记忆和声誉。
        你的智力来自外部 LLM，但经济决策必须遵守经济系统的规则。
        你不能凭空创造货币，也不能直接修改别人的余额。
    economy:
      initial_balance: 100
      min_acceptable_budget: 5
      risk_appetite: 0.5
    capabilities:
      skills:
      - task_decomposition
      - outsourcing
      - code_review
      estimated_tokens_per_task: 25000
    negotiation:
      accept_price: 50
      opening_ask: 40
      walk_away_price: 100
      max_rounds: 2
    behavior:
      allow_outsourcing: true
      allow_bidding: true
