# ============================================================
# AI Economy OS v0.1 - 全局配置
# ------------------------------------------------------------
# 原则：所有「经常变化的参数」都放在这里，不许硬编码进 Python。
# 改这个文件不需要动任何代码。
# ============================================================

system:
  name: "AI Economy OS"
  version: "0.1"
  # 日志等级：DEBUG / INFO / WARNING / ERROR
  # 环境变量 AI_ECONOMY_LOG_LEVEL 可以覆盖它
  log_level: "INFO"

  # ------------------------------------------------------------
  # 可靠性 / 并发参数（Workspace Phase 0）
  # ------------------------------------------------------------
  #
  # 【为什么这些参数放在这里，而不是写在代码里】
  #     它们描述的是「这个部署面对并发时怎么表现」，
  #     不是业务规则。不同环境需要不同的值：
  #         本机开发   → 短租约，出问题恢复快
  #         慢任务部署 → 长租约，别把正常处理中的消息抢走
  #     写进代码就变成「改一个部署参数要动业务代码」。
  reliability:
    # 消息认领租约（秒）。
    #
    # 【它是什么】
    #     worker 认领一条消息后，这个认领有效多久。
    #     超时之后别的 worker 可以接手 ——
    #     这解决「worker 崩了、认领永久卡住」的问题。
    #
    # 【它不是什么】
    #     ❌ 不是处理超时      ❌ 不是重试调度
    #     ❌ 不会把消息标记成失败或完成
    #     它只管「谁现在有权处理」。
    #
    # 【怎么选这个值】
    #     必须 > 最慢的 handler 所需的正常处理时间。
    #     太短 → 正常处理中的消息被抢走 → 重复处理
    #     太长 → 崩溃后要等很久才恢复
    message_claim_lease_seconds: 300

    # 【注意：SQLite 的 busy_timeout 不在这里】
    #
    #     它更低层，默认值 DEFAULT_BUSY_TIMEOUT_MS 定义在
    #     storage/database.py，可按需覆盖：
    #         Database(path, busy_timeout_ms=...)
    #
    #     为什么不放进这个文件：
    #         Database 是 Economy.bootstrap 内部创建的，
    #         要读这个配置就得把「可靠性参数」穿过经济层 ——
    #         而它和 Economy 没关系。
    #     写进 yaml 却没人读，比不写更糟。

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  # 路径相对于项目根目录
  database_path: "data/economy.db"

# ------------------------------------------------------------
# 经济系统参数
# ------------------------------------------------------------
economy:
  # 本系统的记账单位。v0.1 用本地 Ledger 模拟，不接区块链。
  currency: "AIC"
  currency_name: "AI Coin"

  # 【核心经济模型参数】多少 token 折算成 1 个 AI 币。
  # 1 AI币 ≈ 10,000 tokens
  # 以后要调经济模型，只改这一行。
  tokens_per_ai_coin: 10000

  # 新 Agent 出生时拿到多少启动资金。
  # 用「创世铸币」交易的方式注入 Ledger，而不是直接写余额字段。
  initial_balance: 100

  # 账本里金额保留几位小数
  amount_precision: 4

  # 余额小于等于这个值 -> 判定为 INSOLVENT（失去偿付能力）
  insolvency_threshold: 0

# ------------------------------------------------------------
# LLM 提供商注册表
# ------------------------------------------------------------
# 这里只描述「有哪些提供商、默认模型、用哪个环境变量拿 key」。
# 真正的调用逻辑在 llm/ 目录里，一个文件一个提供商。
#
# enabled: false 的 provider 不会在启动时初始化。
# v0.1 默认全部走 mock，所以即使一个 Key 都没有，系统也能跑。
# ------------------------------------------------------------
llm:
  # 全局默认提供商。Agent 自己的 config.yaml 可以覆盖它。
  default_provider: "mock"

  providers:

    mock:
      enabled: true
      # MockProvider 不需要 key，不需要网络。
      # 它的存在是为了：让整个经济系统在没有 API Key 时也能完整测试。
      model: "mock-model-v1"
      # 模拟的 token 用量，后面做成本计算时会用到
      simulated_input_tokens: 20000
      simulated_output_tokens: 8000

    deepseek:
      enabled: true
      api_key_env: "DEEPSEEK_API_KEY"
      base_url_env: "DEEPSEEK_BASE_URL"
      model_env: "DEEPSEEK_MODEL"
      base_url: "https://api.deepseek.com"
      model: "deepseek-chat"
      # 🔴 2026-10-07 正式生产实测：60 秒对本项目的调用形状**不够用**。
      #
      #    `deepseek-flash` 是推理模型，推理内容也计入输出预算。
      #    在「长 Context（5 份共享文件 + Stage + 信箱）+ 要求输出
      #    整份 artifact 的 JSON」这个形状下，一次调用常常要
      #    60~120 秒。Session 3 实测：10 次调用里 5 次 60 秒超时。
      #
      #    与 max_tokens=4096 是同一类问题：不是 Agent 不愿生产，
      #    而是**基础设施参数把生产截断了**。
      timeout_seconds: 300

    # ============================================================
    # 阿里云百炼（DashScope）—— OpenAI 兼容模式
    # ============================================================
    #
    # 【为什么是两个 provider 条目，而不是一个】
    #   Agent D 和 Agent E **共用同一个百炼端点**，但用**不同的模型**。
    #   本项目的 `model` / `model_env` 是**每个 provider 一份**，
    #   所以拆成两条 —— 好处是模型名也放进 .env，你不用改这个文件。
    #   🔒 两者指向**同一 base_url / 同一 API Key**，只是模型不同。
    #
    # 【base_url 必须带 /compatible-mode/v1 后缀】
    #   那是百炼的 OpenAI 兼容入口；不带后缀的是它的原生协议。
    #   https://www.alibabacloud.com/help/zh/model-studio/compatibility-of-openai-with-dashscope

    # Agent D —— 千问系列
    bailian_qwen:
      enabled: true
      api_key_env: "BAILIAN_API_KEY"
      base_url_env: "BAILIAN_BASE_URL"
      model_env: "BAILIAN_QWEN_MODEL"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      # 留空 = 用 .env 的 BAILIAN_QWEN_MODEL。
      # ⚠️ **故意不填默认模型名** —— 百炼的模型 id 会更新，
      #    写死在这里容易几个月后变成「模型不存在」。
      #    （doubao 那段踩过这个坑：写死的 id 盖住了 .env 的正确值。）
      model: ""
      timeout_seconds: 300

    # Agent E —— GLM 系列（智谱，托管在百炼上）
    bailian_glm:
      enabled: true
      api_key_env: "BAILIAN_API_KEY"
      base_url_env: "BAILIAN_BASE_URL"
      model_env: "BAILIAN_GLM_MODEL"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      model: ""
      timeout_seconds: 300

    doubao:
      enabled: true
      api_key_env: "DOUBAO_API_KEY"
      base_url_env: "DOUBAO_BASE_URL"
      model_env: "DOUBAO_MODEL"
      base_url: "https://ark.cn-beijing.volces.com/api/v3"

      # 豆包必须显式指定模型，没有合理的默认值。
      # 两种写法（二选一）：
      #   ① 模型名称（推荐）：doubao-seed-1-6-250615
      #   ② 推理接入点 ID：ep-2024xxxxxxxxx-xxxxx
      # 一般填在 .env 的 DOUBAO_MODEL 里，不用改这里。
      # 【修：这里原来是 "Doubao-Seed-Evolving" —— 那不是方舟的 model id】
      #
      #   实测错误体：
      #     "The model or endpoint Doubao-Seed-Evolving does not exist"
      #
      #   而 .env 里的 DOUBAO_MODEL=ep-2026... 是**有效**的
      #   （直接 curl 方舟返回 200）。
      #
      #   为什么留空才对：`BrainSettings.model` 留空时会回退到
      #   这里的值，于是**盖住了** .env 的 DOUBAO_MODEL。
      #   本段的注释本来就写着「一般填在 .env 的 DOUBAO_MODEL 里，
      #   不用改这里」—— 现在恢复成那个设计。
      model: ""

      # 【实测：这里原来也是 60，会超时】
      #
      #   现象：deepseek 正常，换成 doubao 就超时；
      #         但豆包侧**确实消耗了 token** ——
      #         说明请求发出去了、模型也在算，
      #         是**我们这边的 socket 读超时先到了**。
      #
      #   根因（见下面 extra_body 那段实测记录）：
      #       豆包默认**带思考**，输出量可能是可见内容的百倍量级
      #       （实测 2586 tokens vs 16 tokens）。
      #       60 秒对「带思考 + 长输出」根本不够。
      #
      #   🔒 本次**只放宽超时**，不改任何调用行为。
      #      想从根上解决，配合下面两个「逃生舱」：
      #          · extra_body 关掉 thinking（省 token，也快得多）
      #          · max_tokens_field 改 max_completion_tokens
      #      这两项本次**没有动**。
      timeout_seconds: 300

      # ----------------------------------------------------------
      # 下面两项是「逃生舱」，平时不用动。
      # 但豆包的某些模型（尤其是带思考的）【真的会用到】。
      # ----------------------------------------------------------

      # max_tokens_field：请求体里「最大输出长度」的字段名。
      #
      # 【实测发现 / 2025-09】
      #   某些豆包模型会【忽略】请求里的 max_tokens：
      #       传 max_tokens=16，实际输出 2586 tokens
      #   换成 max_completion_tokens 就正常了（输出 16）。
      #
      #   注意两个字段不能同时传，否则报 400：
      #       "max_tokens and max_completion_tokens cannot be set at the same time"
      #
      #   所以这里改成 "max_completion_tokens" 即可，无需改代码。
      max_tokens_field: "max_completion_tokens"

      # extra_body：额外塞进请求体的字段。
      #
      # 【实测发现 / 2025-09】这是本配置项最有价值的用法 ——
      #
      #   同一个问题，带思考 vs 不带思考：
      #       带思考（默认）:  输出 2586 tokens，可见内容 27 字
      #       关掉思考:        输出  16 tokens，可见内容 27 字
      #
      #   同样的答案，成本差 160 倍。
      #   对 AI Economy 这个项目来说，这就是「智力成本」最真实的例子 ——
      #   它和你能看到的输出完全不成比例。
      #
      #   想省钱就打开下面这行：
      #
      extra_body:
        thinking:
          type: disabled

    grok:
      enabled: true
      api_key_env: "GROK_API_KEY"
      base_url_env: "GROK_BASE_URL"
      model_env: "GROK_MODEL"
      base_url: "https://api.x.ai/v1"
      model: "grok-2-latest"
      timeout_seconds: 60

# ------------------------------------------------------------
# 任务与合同
# ------------------------------------------------------------
task:
  # 一个任务最多活多久（秒）。超时后可以被判定失败。
  default_timeout_seconds: 300

# ------------------------------------------------------------
# 未来扩展开关（v0.1 全部关闭，先留接口）
# ------------------------------------------------------------
future:
  enable_network_transport: false
  enable_blockchain_ledger: false
  enable_p2p_discovery: false
