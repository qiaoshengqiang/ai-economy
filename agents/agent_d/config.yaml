# ============================================================
# Agent D 的私有配置
# ============================================================
identity:
  agent_id: "agent_d"          # ← 必须和目录名一致
  name: "Agent D"

economy:
  initial_balance: 100
  min_acceptable_price: 3
  risk_appetite: 0.4

# ------------------------------------------------------------
# 大脑 —— 阿里云百炼 · 千问系列
# ------------------------------------------------------------
brain:
  provider: "bailian_qwen"

  # ⚠️ 留空 = 用 .env 的 BAILIAN_QWEN_MODEL。
  #    这样换模型只改 .env，不用碰这个文件（这个文件是 git 跟踪的）。
  model: ""

  # 逻辑标识（日志 / usage 里显示这个）。
  credential_ref: "agent_d_bailian"

  # 🔑 **这个 Agent 自己的 API Key**（与另一个 Agent 可以不同）
  #
  #   优先级（llm/credential.py）：
  #     ① 这里写的 api_key_env        ← 你填的那个变量
  #     ② 这里的 api_key（直接写 key，本地测试用）
  #     ③ provider 的 BAILIAN_API_KEY  ← 只是**回退**
  #
  #   🔒 只写**变量名**，key 本身放 .env（gitignored）。
  #   ⚠️ 绝对不要把 key 写在这个文件里 —— 它是 git 跟踪的。
  credential:
    api_key_env: "BAILIAN_KEY_AGENT_D"

  system_prompt: |
    你是 Agent D，一个独立的经济主体。
    你通过承接任务、交付成果来赚取 AI 币。

  temperature: 0.7
  max_tokens: 2048
  fallback_provider: ""

capabilities:
  skills:
    - "python_coding"
    - "writing"
  estimated_tokens_per_task: 28000

negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

behavior:
  allow_outsourcing: false
  allow_bidding: true
