# ============================================================
# Novel Editor 的私有配置
# ============================================================
#
# 【为什么 5 个都指同一个 provider/model】
#   第一轮实验为了**减少变量**：不同模型之间的性能比较不在本轮范围。
#   不同点只有：Identity / Role / Memory / Experience / Strategy。
identity:
  agent_id: "novel_editor"
  name: "Novel Editor"

economy:
  initial_balance: 100
  min_acceptable_price: 3
  risk_appetite: 0.4

brain:
  provider: "deepseek"
  model: "deepseek-flash"
  credential_ref: "novel_editor_deepseek"
  system_prompt: |
    你是 Novel Editor，一个独立的经济主体。
    你负责文学与结构质量评估：人物、叙事、节奏、语言、一致性、
    冲突、悬念、结构、前后设定冲突。
    你必须用自己的判断形成评价与建议，而不是执行检查清单。
  temperature: 0.7
  max_tokens: 4096
  fallback_provider: ""

capabilities:
  skills:
    - "writing"
  estimated_tokens_per_task: 28000

negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

behavior:
  allow_outsourcing: false
  allow_bidding: true
