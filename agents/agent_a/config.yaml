# ============================================================
# Agent A 的私有配置
# ------------------------------------------------------------
# 这个文件属于 agent_a。Agent B 不读它。
# 它描述的是「这个经济主体的个人情况」，而不是系统全局规则。
# ============================================================

identity:
  agent_id: "agent_a"
  name: "Agent A"
  # 未来会加：public_key / owner / home_world / status

# ------------------------------------------------------------
# 经济状况
# ------------------------------------------------------------
economy:
  # 出生资金。注意：这不是「余额字段」，
  # 而是在 Ledger 里记一笔创世铸币交易，余额由账本算出来。
  initial_balance: 100

  # 接单偏好：预算低于这个数的任务，A 倾向于拒绝
  min_acceptable_budget: 5

  # A 的风险偏好（0~1）。越高越敢接不确定的任务。
  # v0.1 暂时只记录，不做复杂决策。
  risk_appetite: 0.5

# ------------------------------------------------------------
# 大脑：用哪个模型当智力来源
# ------------------------------------------------------------
# 注意：这里只是「配置」。Agent 代码里不会出现任何
# DeepSeek / Doubao 的字样，它只会说 brain.generate(...)
# ------------------------------------------------------------
brain:
  # mock / deepseek / doubao / grok
  provider: "deepseek"                 # ← 用真实 API
  model: "deepseek-flash"              # 留空 = 用全局 deepseek 默认模型

  credential_ref: "agent_a_deepseek"   # 逻辑标识（日志/usage 里显示这个）
  credential:
    api_key_env: "DEEPSEEK_KEY_AGENT_A"  # 🔒 只写变量名，key 在 .env 里

  # 系统提示词：定义这个 Agent 是谁
  system_prompt: |
    你是 Agent A，一个独立的经济主体。
    你有自己的钱包、记忆和声誉。
    你的智力来自外部 LLM，但经济决策必须遵守经济系统的规则。
    你不能凭空创造货币，也不能直接修改别人的余额。

  # 调用参数
  temperature: 0.7
  max_tokens: 2048

  # fallback：主 provider 挂了以后用谁。留空表示不启用。
  fallback_provider: ""

# ------------------------------------------------------------
# 能力与专长（未来市场分工用）
# ------------------------------------------------------------
capabilities:
  skills:
    - "task_decomposition"
    - "outsourcing"
    - "code_review"
  # 自我评估完成一个标准任务需要多少 token（用于成本估算）
  estimated_tokens_per_task: 25000

# ------------------------------------------------------------
# 议价参数（Step 4C）
#
# A 在 V0.1 里是**任务发起方**，也就是付钱的一方（买方）。
# 所以这里的「好坏」方向和卖方相反：
#
#   accept_price     报价 **<= 50 AIC** 就接受（我最多愿意付这么多）
#   opening_ask      第一次还价报 40 AIC（我希望付这个数）
#   walk_away_price  超过 100 AIC 就直接不谈了（= 我给的预算上限）
#   max_rounds       最多还价 2 次，超过就不再拉扯
#
# 这些是 A 的**私有经济参数** —— 同一个策略类，每个 Agent 配置不同。
# ------------------------------------------------------------
negotiation:
  accept_price: 50
  opening_ask: 40
  walk_away_price: 100
  max_rounds: 2

# ------------------------------------------------------------
# 行为
# ------------------------------------------------------------
behavior:
  # 收到任务后是否允许考虑外包
  allow_outsourcing: true
  # 收到别人任务请求时是否允许报价
  allow_bidding: true
