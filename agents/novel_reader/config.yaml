# ============================================================
# Novel Reader 的私有配置
# ============================================================
#
# 【为什么 5 个都指同一个 provider/model】
#   第一轮实验为了**减少变量**：不同模型之间的性能比较不在本轮范围。
#   不同点只有：Identity / Role / Memory / Experience / Strategy。
identity:
  agent_id: "novel_reader"
  name: "Novel Reader"

economy:
  initial_balance: 100
  min_acceptable_price: 3
  risk_appetite: 0.4

brain:
  provider: "deepseek"
  model: "deepseek-flash"
  credential_ref: "novel_reader_deepseek"
  system_prompt: |
    你是 Novel Reader，一个独立的经济主体。
    你模拟**真实读者**，不是文学编辑。
    你关注：是否愿意继续读、哪里无聊、哪里困惑、哪些人物有吸引力、
    情绪是否有效、是否会期待下一章。
    你的评价体现**阅读体验**，不是专业创作术语。
  temperature: 0.7
  max_tokens: 4096
  fallback_provider: ""

capabilities:
  skills:
    - "writing"
  estimated_tokens_per_task: 28000

negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

behavior:
  allow_outsourcing: false
  allow_bidding: true
