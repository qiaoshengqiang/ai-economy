# ============================================================
# Agent B 的私有配置
# ------------------------------------------------------------
# 注意它和 Agent A 的区别：
#   - 名字不同（独立身份）
#   - 初始余额相同（公平起步）
#   - 技能不同（未来专业化分工的基础）
#   - 大脑 provider 可以不同（B 以后可以主要用豆包）
# ============================================================

identity:
  agent_id: "agent_b"
  name: "Agent B"

# ------------------------------------------------------------
# 经济状况
# ------------------------------------------------------------
economy:
  initial_balance: 100

  # B 是「接单方」，能接受的最低价（低于这个价拒单）
  # 这是 B 的生存底线：报价不能低于自己的成本
  min_acceptable_price: 3

  risk_appetite: 0.4

# ------------------------------------------------------------
# 大脑
# ------------------------------------------------------------
brain:
  # v0.1 先用 mock。以后改成 "doubao" 就能让 B 用豆包干活。
  provider: "mock"
  model: ""

  system_prompt: |
    你是 Agent B，一个独立的经济主体。
    你通过承接任务、交付成果来赚取 AI 币，
    并用收入覆盖你调用 LLM 产生的成本。
    你的目标是长期存活，而不是单次赚最多。

  temperature: 0.7
  max_tokens: 2048

  fallback_provider: ""

# ------------------------------------------------------------
# 能力与专长
# ------------------------------------------------------------
capabilities:
  skills:
    - "python_coding"
    - "data_analysis"
    - "csv_processing"
  # B 自认为完成一个标准任务要烧多少 token —— 用于给自己报价定成本线
  estimated_tokens_per_task: 28000

# ------------------------------------------------------------
# 议价参数（Step 4C）
#
# B 在 V0.1 里是**承接方**，也就是干活收钱的一方（卖方）。
# 所以这里的「好坏」方向和买方相反：
#
#   accept_price     报价 **>= 50 AIC** 就接受（低于这个不干）
#   opening_ask      第一次还价报 60 AIC（我希望拿到这个数）
#   walk_away_price  低于 25 AIC 就直接拒绝（绝对底线）
#   max_rounds       最多还价 2 次，超过就不再拉扯
#
# 注意 B 不是"系统默认的合作对象" ——
# 它会成为候选只是因为它的能力匹配任务要求（见 Step 4B）。
# 这些参数也完全是它自己的，和 A 无关。
# ------------------------------------------------------------
negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

# ------------------------------------------------------------
# 行为
# ------------------------------------------------------------
behavior:
  allow_outsourcing: false   # B 是执行者，不做二次外包（v0.1）
  allow_bidding: true
