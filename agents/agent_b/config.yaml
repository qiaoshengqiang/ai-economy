# ============================================================
# Agent B 的私有配置
# ------------------------------------------------------------
# 注意它和 Agent A 的区别：
#   - 名字不同（独立身份）
#   - 初始余额相同（公平起步）
#   - 技能不同（未来专业化分工的基础）
#   - 大脑 provider 可以不同（B 以后可以主要用豆包）
# ============================================================

identity:
  agent_id: "agent_b"
  name: "Agent B"

# ------------------------------------------------------------
# 经济状况
# ------------------------------------------------------------
economy:
  initial_balance: 100

  # B 是「接单方」，能接受的最低价（低于这个价拒单）
  # 这是 B 的生存底线：报价不能低于自己的成本
  min_acceptable_price: 3

  risk_appetite: 0.4

# ------------------------------------------------------------
# 大脑
# ------------------------------------------------------------
brain:
  # v0.1 先用 mock。以后改成 "doubao" 就能让 B 用豆包干活。
  provider: "mock"
  model: ""

  system_prompt: |
    你是 Agent B，一个独立的经济主体。
    你通过承接任务、交付成果来赚取 AI 币，
    并用收入覆盖你调用 LLM 产生的成本。
    你的目标是长期存活，而不是单次赚最多。

  temperature: 0.7
  max_tokens: 2048

  fallback_provider: ""

# ------------------------------------------------------------
# 能力与专长
# ------------------------------------------------------------
capabilities:
  skills:
    - "python_coding"
    - "data_analysis"
    - "csv_processing"
  # B 自认为完成一个标准任务要烧多少 token —— 用于给自己报价定成本线
  estimated_tokens_per_task: 28000

# ------------------------------------------------------------
# 行为
# ------------------------------------------------------------
behavior:
  allow_outsourcing: false   # B 是执行者，不做二次外包（v0.1）
  allow_bidding: true
