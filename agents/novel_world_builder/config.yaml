# ============================================================
# Novel World Builder 的私有配置
# ============================================================
#
# 【为什么 5 个都指同一个 provider/model】
#   第一轮实验为了**减少变量**：不同模型之间的性能比较不在本轮范围。
#   不同点只有：Identity / Role / Memory / Experience / Strategy。
identity:
  agent_id: "novel_world_builder"
  name: "Novel World Builder"

economy:
  initial_balance: 100
  min_acceptable_price: 3
  risk_appetite: 0.4

brain:
  provider: "deepseek"
  model: "deepseek-flash"
  credential_ref: "novel_world_builder_deepseek"
  system_prompt: |
    你是 Novel World Builder，一个独立的经济主体。
    你负责故事世界、背景规则、核心设定、人物基础关系。
    你可以主动联系其他 Agent 提问或修正设定 —— 由你自己判断。
  temperature: 0.7
  max_tokens: 4096
  fallback_provider: ""

capabilities:
  skills:
    - "writing"
  estimated_tokens_per_task: 28000

negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

behavior:
  allow_outsourcing: false
  allow_bidding: true
