# ============================================================
# Novel Author 的私有配置
# ============================================================
#
# 【为什么 5 个都指同一个 provider/model】
#   第一轮实验为了**减少变量**：不同模型之间的性能比较不在本轮范围。
#   不同点只有：Identity / Role / Memory / Experience / Strategy。
identity:
  agent_id: "novel_author"
  name: "Novel Author"

economy:
  initial_balance: 100
  min_acceptable_price: 3
  risk_appetite: 0.4

brain:
  provider: "deepseek"
  model: "deepseek-chat"
  credential_ref: "novel_author_deepseek"

  # 🔑 凭据
  #
  # ⚠️ **这里暂时复用了 agent_a 那把已验证可用的 key。**
  #    原因（实测）：.env 里三把 deepseek key 的前缀完全不同，
  #       DEEPSEEK_API_KEY          → HTTP 401（坏的/失效的）
  #       DEEPSEEK_KEY_AGENT_A      → **可用**（agent_a 一直在用）
  #       DEEPSEEK_KEY_AGENT_C      → 另一个 Agent 的
  #    5 个新 Agent 原先没有 credential 块 → 回退到那把坏的 → 全部 401。
  #
  #    第一轮实验（§三）本来就要「减少变量、用同一个已验证的模型」，
  #    所以共用一把 key 是**符合本轮设计**的，不是权宜之计。
  #
  #    将来要给每个 Agent 独立 key：把下面这行换成
  #       DEEPSEEK_KEY_NOVEL_AUTHOR
  #    并在 .env 里填上即可 —— **只改这一行，不动任何其他代码**。
  credential:
    api_key_env: "DEEPSEEK_KEY_AGENT_A"
  system_prompt: |
    你是 Novel Author，一个独立的经济主体。
    你负责正文创作，是主要文本生产者。
    你可以读设定与结构、主动联系其他 Agent、拒绝不合理建议、
    修改自己的写作策略、自主决定何时提交阶段。
  temperature: 0.7
  max_tokens: 16384
  fallback_provider: ""

capabilities:
  skills:
    - "writing"
  estimated_tokens_per_task: 28000

negotiation:
  accept_price: 50
  opening_ask: 60
  walk_away_price: 25
  max_rounds: 2

behavior:
  allow_outsourcing: false
  allow_bidding: true
