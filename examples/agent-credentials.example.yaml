# ============================================================
# Agent 独立 Credential —— 配置示例
# ============================================================
#
# 这段内容放在 `agents/<agent_id>/config.yaml` 的 `brain:` 下面。
#
# 正式确立的边界：
#
#     Agent Identity  ≠  Credential  ≠  Provider Account
#
# Provider Account **不是**本系统的概念 —— 它只是 API Key
# 背后的外部资源归属。
#
# ------------------------------------------------------------
# 【两种来源，优先级：api_key_env 高于 api_key】
# ------------------------------------------------------------
#
# ① api_key_env（**推荐**，用于正常运行）
#    系统读 os.environ["DEEPSEEK_KEY_AGENT_A"]
#
# ② api_key（**测试阶段的合法方式**，不是 hack）
#    直接在配置文件里写 key，方便本地给不同 Agent 配不同 Key
#
# 为什么 api_key_env 优先？
#    开发者本地常同时留着正式的环境变量和一个旧测试 key。
#    正式运行应该走环境变量，不该意外继续用旧 key。
#
# 如果两者都没有 → 回退到 **全局** provider credential
# （即 config/config.yaml 里的 llm.providers.<p>.api_key_env），
# 所以**旧配置继续可用**。
#
# ------------------------------------------------------------

# ============================================================
# 示例 A：用环境变量（推荐）
# ============================================================
# agents/agent_a/config.yaml
brain:
  provider: "deepseek"
  model: "deepseek-flash"
  credential_ref: "agent_a_deepseek"      # 逻辑标识，出现在日志/usage 里
  credential:
    api_key_env: "DEEPSEEK_KEY_AGENT_A"   # 🔒 只写变量名，不写 key

# agents/agent_b/config.yaml
# brain:
#   provider: "deepseek"
#   model: "deepseek-flash"
#   credential_ref: "agent_b_deepseek"
#   credential:
#     api_key_env: "DEEPSEEK_KEY_AGENT_B"

# ============================================================
# 示例 B：直接写 key（本地测试用）
# ============================================================
# agents/agent_a/config.yaml
# brain:
#   provider: "deepseek"
#   model: "deepseek-flash"
#   credential_ref: "agent_a_deepseek"
#   credential:
#     api_key: "sk-agent-a-..."             # 只在本地测试时这样写

# agents/agent_b/config.yaml
# brain:
#   provider: "deepseek"
#   model: "deepseek-flash"
#   credential_ref: "agent_b_deepseek"
#   credential:
#     api_key: "sk-agent-b-..."

# ============================================================
# 示例 C：混合（迁移期）
# ============================================================
# agent_a 有自己的 credential（上面示例 A）
# agent_b **不写** credential 段
#     → 自动回退到 config/config.yaml 的全局 deepseek credential
#
# 这样可以从「全部用全局」逐步迁移到「每个 Agent 独立」。

# ============================================================
# ⚠️ 安全提醒
# ============================================================
#
# · 如果把 api_key 直接写进 agents/*/config.yaml，
#   那个文件**会被 git 跟踪** —— 千万别提交真 key。
# · 想本地写又不想提交，可以：
#       ① 用 api_key_env（推荐）
#       ② 把具体 agent 的 config.yaml 加进 .gitignore
#       ③ 用 agents/<id>/config.local.yaml 之类的本地覆盖（当前未实现）
